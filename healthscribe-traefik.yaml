http:
  routers:
    supabase-http:
      rule: "Host(`supabase.healthscribe.pro`)"
      service: supabase-backend
      entryPoints:
        - web
      middlewares:
        - redirect-https

    supabase-websecure:
      rule: "Host(`supabase.healthscribe.pro`)"
      service: supabase-backend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
      tls:
        certResolver: le

    n8n-http:
      rule: "Host(`n8n.healthscribe.pro`)"
      service: n8n
      entryPoints:
        - web
      middlewares:
        - redirect-https

    n8n-websecure:
      rule: "Host(`n8n.healthscribe.pro`)"
      service: n8n
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
      tls:
        certResolver: le

    healthscribe-http:
      rule: "Host(`healthscribe.pro`) || Host(`www.healthscribe.pro`)"
      service: healthscribe-app
      entryPoints:
        - web
      middlewares:
        - redirect-https

    healthscribe-websecure:
      rule: "Host(`healthscribe.pro`) || Host(`www.healthscribe.pro`)"
      service: healthscribe-app
      entryPoints:
        - websecure
      tls:
        certResolver: le

  services:
    supabase-backend:
      loadBalancer:
        servers:
          - url: "http://supabase-kong:8000"

    n8n:
      loadBalancer:
        servers:
          - url: "http://n8n:5678"

    healthscribe-app:
      loadBalancer:
        servers:
          - url: "http://app:3000"

  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "https://healthscribe.pro"
          - "https://www.healthscribe.pro"
          - "https://supabase.healthscribe.pro"
        accessControlAllowHeaders:
          - "*"
        accessControlExposeHeaders:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600
        addVaryHeader: true

