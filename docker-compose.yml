name: healthscribe

services:
  traefik:
    image: traefik:v2.11
    command:
      - --log.level=DEBUG
      - --providers.docker=true
      - --providers.docker.network=traefik-proxy
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=false
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:?TRAEFIK_ACME_EMAIL missing}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
      - ./healthscribe-traefik.yaml:/etc/traefik/dynamic/healthscribe-traefik.yaml:ro
    networks:
      - traefik-proxy
    # No labels - we don't expose traefik dashboard to avoid rate limiting issues
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST:?N8N_HOST missing}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - TRUST_PROXY=true
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://${N8N_HOST}}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY missing}
      - DB_TYPE=sqlite
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - N8N_EDITOR_BASE_URL=https://${N8N_HOST}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - traefik-proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n-http.rule=Host(`${N8N_HOST}`)
      - traefik.http.routers.n8n-http.entrypoints=web
      - traefik.http.routers.n8n-http.middlewares=n8n-https
      - traefik.http.middlewares.n8n-https.redirectscheme.scheme=https
      - traefik.http.routers.n8n.rule=Host(`${N8N_HOST}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=le
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    restart: unless-stopped

  app:
    image: healthscribe/app:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL missing}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY missing}
        NEXT_PUBLIC_N8N_URL: ${NEXT_PUBLIC_N8N_URL:?NEXT_PUBLIC_N8N_URL missing}
        NEXT_PUBLIC_N8N_WEBHOOK_URL: ${NEXT_PUBLIC_N8N_WEBHOOK_URL:?NEXT_PUBLIC_N8N_WEBHOOK_URL missing}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:?NEXT_PUBLIC_URL missing}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL missing}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL missing}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - n8n
      - redis
    networks:
      internal:
        aliases:
          - app
      traefik-proxy:
        aliases:
          - app
    # Labels disabled - using file provider instead
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  traefik-acme:
  n8n-data:
  redis-data:

networks:
  traefik-proxy:
    external: true
  internal:
    driver: bridge
