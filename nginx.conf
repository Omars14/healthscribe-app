user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 50M;

  upstream app_backend {
    server app:3000;
  }

  upstream n8n_backend {
    server n8n:5678;
  }

  # HTTP server for ACME challenges and redirect to HTTPS
  server {
    listen 80;
    server_name www.healthscribe.pro n8n.healthscribe.pro healthscribe.pro;

    # ACME challenge directory for Let's Encrypt
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS for www.healthscribe.pro
  server {
    listen 443 ssl http2;
    server_name www.healthscribe.pro;

    # Use Let's Encrypt cert (healthscribe.pro-0001) - absolute host path
    ssl_certificate /certs/letsencrypt/archive/healthscribe.pro-0001/fullchain1.pem;
    ssl_certificate_key /certs/letsencrypt/archive/healthscribe.pro-0001/privkey1.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    location / {
      proxy_pass http://app_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # HTTPS for n8n.healthscribe.pro
  server {
    listen 443 ssl http2;
    server_name n8n.healthscribe.pro;

    # Use Let's Encrypt cert - absolute host path
    ssl_certificate /certs/letsencrypt/archive/n8n.healthscribe.pro/fullchain1.pem;
    ssl_certificate_key /certs/letsencrypt/archive/n8n.healthscribe.pro/privkey1.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    location / {
      proxy_pass http://n8n_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
